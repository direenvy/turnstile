name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "frontend/data/**", "frontend/public/ridership.csv"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - name: Replay the committed snapshot through the checks
        # The live data must pass its own gate; a rule change that breaks on
        # real data fails here before it fails at 02:00.
        run: |
          latest=$(python -c "import json;print(json.load(open('data/raw/manifest.json'))[-1]['path'])")
          python -m pipeline.run --file "data/raw/$latest" --today "$(date -u +%F)" --force

  frontend:
    name: Dashboard builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
