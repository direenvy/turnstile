name: Pipeline

# Runs every day at 02:00 UTC (10:00 in Kuala Lumpur), fetches the upstream
# file, checks it, and commits whatever changed under data/. A failed check
# fails this workflow — GitHub emails the owner — and nothing is published.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the marts even if the snapshot is unchanged
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Ingest, validate, transform
        id: run
        run: |
          set -o pipefail
          python -m pipeline.run ${{ inputs.force && '--force' || '' }} 2>&1 | tee run.log
      - name: Commit what changed
        # Runs even when the checks failed, so the failed run record and the
        # quality report land in the repo and on the dashboard.
        if: always()
        run: |
          git config user.name "turnstile-bot"
          git config user.email "turnstile-bot@users.noreply.github.com"
          git add data frontend/data frontend/public/ridership.csv
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            status=$(python -c "import json;print(json.load(open('data/runs/latest.json'))['status'])")
            latest=$(python -c "import json;print(json.load(open('data/runs/latest.json')).get('max_date','?'))")
            git commit -m "Pipeline run $(date -u +%F): ${status}, data to ${latest}"
            git push
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: run-log-${{ github.run_id }}
          path: run.log
          retention-days: 30
